<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>8th Grade High School Transition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Fredoka+One&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3rem;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: white;
            text-shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }

        .button-container {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cute-btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            padding: 1.5rem 3rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            position: relative;
            transform-origin: center;
        }

        .cute-btn:hover {
            transform: translateY(-8px) scale(1.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .cute-btn:active {
            transform: translateY(-2px) scale(1.05);
        }

        .classes-btn {
            background: linear-gradient(135deg, #FF6B9D 0%, #FF8E72 100%);
        }

        .questions-btn {
            background: linear-gradient(135deg, #6BCB77 0%, #4D96FF 100%);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .cute-btn {
                font-size: 1.1rem;
                padding: 1rem 2rem;
            }

            .button-container {
                gap: 1.5rem;
            }
        }
    </style>
    <script src="/public/js/main.js"></script>
</head>

<body>
    <h1>✨ Welcome 8th Graders ✨</h1>

    <div class="button-container">
        <button class="cute-btn classes-btn"> Classes Maker 📚</button>
        <button class="cute-btn questions-btn"> Questions ❓</button>
    </div>
</body>
</html>

<footer>
