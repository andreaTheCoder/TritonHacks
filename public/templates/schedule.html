{% extends "layout.html" %}
{% block body %}
<script src="/js/schedule.js"></script>
<div class="schedule-container">
    <h1 class="schedule-title">1 Year Schedule</h1>
    <table cellpadding = "10" cellspacing = "10">
        <tr>
            <td>
                <select id="elective-dropdown-1" class="schedule-dropdown">
                    <option value="">Choose a Health Class</option>
                    <option value="ENS 1-2">ENS 1-2</option>
                    <option value="ENS 1-2 Online">ENS 1-2 Online</option>
                </select>
            </td>
            <td>
                <select id="elective-dropdown-2" class="schedule-dropdown">
                    <option value="">Choose a PE Credits Class</option>
                    <option value="ENS 3-4">ENS 3-4</option>
                    <option value="NJROTC">NJROTC</option>
                    <option value="Marching Band">Marching PE with Band</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <select id="elective-dropdown-3" class="schedule-dropdown">
                    <option value="">Choose an English Class</option>
                    <option value="English 1-2">English 1-2</option>
                    <option value="Honors English 1-2">Honors English 1-2</option>
                </select>
            </td>
            <td>
                <select id="elective-dropdown-4" class="schedule-dropdown">
                    <option value="">Choose an Elective</option>
                    {% for class in classes %}
                        <option value="{{ class[0] }}">{{ class[0] }}</option>
                    {% endfor %}
            </td>
        </tr>
        <tr>
            <td>
                <select id="elective-dropdown-5" class="schedule-dropdown">
                    <option value="">Choose an Elective</option>
                    {% for class in classes %}
                        <option value="{{ class[0] }}">{{ class[0] }}</option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <select id="elective-dropdown-6" class="schedule-dropdown">
                    <option value="">Choose an Elective</option>
                    {% for class in classes %}
                        <option value="{{ class[0] }}">{{ class[0] }}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <select id="elective-dropdown-7" class="schedule-dropdown">
                    <option value="">Choose an Elective</option>
                    {% for class in classes %}
                        <option value="{{ class[0] }}">{{ class[0] }}</option>
                    {% endfor %}
                </select>
            </td>
            <td>
                <select id="elective-dropdown-8" class="schedule-dropdown">
                    <option value="">Choose an Elective</option>
                    {% for class in classes %}
                        <option value="{{ class[0] }}">{{ class[0] }}</option>
                    {% endfor %}
                </select>
            </td>
        </tr>
    </table>

    <div class="button-group">
        <button class="save-button" onclick="saveSchedule()">💾 Save Schedule</button>
        <a href="/" class="back-button">← Back to Home</a>
    </div>
</div>
<script>
function saveSchedule()
{
    for (i = 1; i <= 8; i++)
    {
        console.log(document.getElementById('elective-dropdown-' + i).value)
    }

}
</script>
{% endblock %}
